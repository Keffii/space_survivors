version: 1
backend:
  phases:
    preBuild:
      commands:
        # Some backend dependencies (sync-fetch, @whatwg-node/*) require Node.js 22.12+
        - nvm install 22
        - nvm use 22
    build:
      commands:
        # npm install, not npm ci: @aws-amplify/data-construct and graphql-api-construct
        # bundle OpenTelemetry packages with mismatched versions, and npm ci's lock-file
        # check rejects them. npm install leaves package-lock.json unchanged.
        - npm install --cache .npm --prefer-offline --no-audit --no-fund
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
